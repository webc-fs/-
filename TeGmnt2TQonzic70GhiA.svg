<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1018" fill="none" viewBox="0 0 1200 1018"><defs><linearGradient id="bg_grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b14"/><stop offset="50%" stop-color="#0c1322"/><stop offset="100%" stop-color="#080e1a"/></linearGradient><linearGradient id="card_grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/></linearGradient><linearGradient id="title_grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="grad_fastalp" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><linearGradient id="grad_cpp_alp" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#34d399"/></linearGradient><linearGradient id="grad_pco" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient><linearGradient id="grad_zstd" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient><linearGradient id="grad_lz4" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#db2777"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="grad_snappy" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="grad_chimp128" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient><linearGradient id="grad_gorilla" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#64748b"/></linearGradient><filter id="card_shadow" width="110%" height="115%" x="-5%" y="-5%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".3" stdDeviation="6"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.algo-row:hover rect{opacity:.95}</style><rect width="1200" height="1018" fill="url(#bg_grad)" rx="16"/><rect width="1200" height="1018" stroke="rgba(51, 65, 85, 0.5)" stroke-width="1.5" rx="16"/><path stroke="rgba(30, 41, 59, 0.6)" stroke-dasharray="4 4" d="M0 120h1200"/><text x="36" y="52" fill="url(#title_grad)" font-size="26" font-weight="800" letter-spacing=".5">fastalp 浮点压缩基准横向评测</text><text x="36" y="80" fill="#94a3b8" font-size="14">多算法同机实测：解压吞吐量、压缩比与物理时序场景全量对比</text><g transform="translate(720 28)"><rect width="444" height="66" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(51, 65, 85, 0.7)" rx="8"/><text x="14" y="20" fill="#38bdf8" font-size="11" font-weight="bold">BENCHMARK ENVIRONMENT</text><text x="14" y="38" fill="#cbd5e1" font-size="11">CPU: Apple M2 Max (12 核心: 8 性能核 @ 3.68 GHz + 4 能效核 @ 2.42 GHz)</text><text x="14" y="54" fill="#94a3b8" font-size="10.5">工具链: Rust 1.98.0 / LLVM Clang 22.1.8 (-O3 -march=native) ｜ 系统: macOS Sequoia 26.5.1 (Darwin 25.5.0 arm64)</text></g><g transform="translate(24 160)"><rect width="270" height="100" fill="url(#card_grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="url(#card_shadow)" rx="12"/><text x="16" y="26" fill="#94a3b8" font-size="12" font-weight="600">单核解压吞吐峰值</text><text x="16" y="60" fill="#38bdf8" font-size="28" font-weight="800">77.0 GB/s</text><text x="16" y="82" fill="#64748b" font-size="11">较 C++ 原版提速 3.52x (同值序列 136 ns)</text></g><g transform="translate(318 160)"><rect width="270" height="100" fill="url(#card_grad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5" filter="url(#card_shadow)" rx="12"/><text x="16" y="26" fill="#94a3b8" font-size="12" font-weight="600">连续时序压缩率 (Ramp)</text><text x="16" y="60" fill="#34d399" font-size="28" font-weight="800">431.2x</text><text x="16" y="82" fill="#64748b" font-size="11">较 Pcodec 提升 9.7x，较 C++ 原版提升 458x</text></g><g transform="translate(612 160)"><rect width="270" height="100" fill="url(#card_grad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" filter="url(#card_shadow)" rx="12"/><text x="16" y="26" fill="#94a3b8" font-size="12" font-weight="600">31 数据集解压均值</text><text x="16" y="60" fill="#818cf8" font-size="28" font-weight="800">18.0 GB/s</text><text x="16" y="82" fill="#64748b" font-size="11">较 Pcodec 提速 9.0x，较 Zstd 提速 12.6x</text></g><g transform="translate(906 160)"><rect width="270" height="100" fill="url(#card_grad)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5" filter="url(#card_shadow)" rx="12"/><text x="16" y="26" fill="#94a3b8" font-size="12" font-weight="600">31 数据集总压缩体积</text><text x="16" y="60" fill="#f472b6" font-size="28" font-weight="800">97.9 KB</text><text x="16" y="82" fill="#64748b" font-size="11">较 C++ 原版节省 4.79% 空间，零负压缩膨胀</text></g><text x="36" y="276" fill="#f8fafc" font-size="16" font-weight="bold">ALP 论文 31 个真实公开数据集全量综合对比 (253,952 字节)</text><text x="36" y="294" fill="#94a3b8" font-size="12">衡量各算法面对广泛真实物理、金融、气象、医疗等浮点数据的综合处理能力</text><text x="42" y="322" fill="#64748b" font-size="11.5" font-weight="bold">算法名称</text><text x="260" y="322" fill="#64748b" font-size="11.5" font-weight="bold">解码吞吐 (DECODE GB/s)</text><text x="690" y="322" fill="#64748b" font-size="11.5" font-weight="bold">压缩比</text><text x="880" y="322" fill="#64748b" font-size="11.5" font-weight="bold">31集总体积</text><text x="1020" y="322" fill="#64748b" font-size="11.5" font-weight="bold">编码吞吐</text><path stroke="rgba(51, 65, 85, 0.6)" d="M24 328h1152"/><g class="algo-row"><rect width="1152" height="42" x="24" y="336" fill="rgba(14, 165, 233, 0.08)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" rx="8"/><text x="42" y="360" fill="#38bdf8" font-size="14" font-weight="bold">fastalp (Rust)</text><rect width="62" height="18" x="180" y="344" fill="#0284c7" rx="4"/><text x="211" y="357" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">FASTEST</text><rect width="340" height="18" x="260" y="346" fill="rgba(15, 23, 42, 0.6)" rx="4"/><rect width="252.96" height="18" x="260" y="346" fill="url(#grad_fastalp)" rx="4"/><text x="520.96" y="360" fill="#38bdf8" font-size="12" font-weight="bold">18.60 GB/s</text><text x="690" y="360" fill="#38bdf8" font-size="13" font-weight="bold">2.59x</text><text x="760" y="360" fill="#94a3b8" font-size="12">(24.7 b/v)</text><text x="880" y="360" fill="#cbd5e1" font-size="13">95.6 KB</text><text x="1020" y="360" fill="#94a3b8" font-size="13">2.24 GB/s</text></g><g class="algo-row"><rect width="1152" height="42" x="24" y="382" fill="rgba(30, 41, 59, 0.35)" rx="8"/><text x="42" y="406" fill="#f1f5f9" font-size="14" font-weight="600">C++ ALP (Reference)</text><rect width="340" height="18" x="260" y="392" fill="rgba(15, 23, 42, 0.6)" rx="4"/><rect width="297.16" height="18" x="260" y="392" fill="url(#grad_cpp_alp)" rx="4"/><text x="565.16" y="406" fill="#34d399" font-size="12" font-weight="500">21.85 GB/s</text><text x="690" y="406" fill="#e2e8f0" font-size="13" font-weight="600">2.47x</text><text x="760" y="406" fill="#94a3b8" font-size="12">(25.9 b/v)</text><text x="880" y="406" fill="#cbd5e1" font-size="13">100.5 KB</text><text x="1020" y="406" fill="#94a3b8" font-size="13">0.84 GB/s</text></g><g class="algo-row"><rect width="1152" height="42" x="24" y="428" fill="rgba(30, 41, 59, 0.35)" rx="8"/><text x="42" y="452" fill="#f1f5f9" font-size="14" font-weight="600">Pcodec (pco)</text><rect width="340" height="18" x="260" y="438" fill="rgba(15, 23, 42, 0.6)" rx="4"/><rect width="26.112" height="18" x="260" y="438" fill="url(#grad_pco)" rx="4"/><text x="294.112" y="452" fill="#fbbf24" font-size="12" font-weight="500">1.92 GB/s</text><text x="690" y="452" fill="#e2e8f0" font-size="13" font-weight="600">3.06x</text><text x="760" y="452" fill="#94a3b8" font-size="12">(20.9 b/v)</text><text x="880" y="452" fill="#cbd5e1" font-size="13">80.9 KB</text><text x="1020" y="452" fill="#94a3b8" font-size="13">0.23 GB/s</text></g><g class="algo-row"><rect width="1152" height="42" x="24" y="474" fill="rgba(30, 41, 59, 0.35)" rx="8"/><text x="42" y="498" fill="#f1f5f9" font-size="14" font-weight="600">Zstd (level 3)</text><rect width="340" height="18" x="260" y="484" fill="rgba(15, 23, 42, 0.6)" rx="4"/><rect width="18.904" height="18" x="260" y="484" fill="url(#grad_zstd)" rx="4"/><text x="286.904" y="498" fill="#a78bfa" font-size="12" font-weight="500">1.39 GB/s</text><text x="690" y="498" fill="#e2e8f0" font-size="13" font-weight="600">2.51x</text><text x="760" y="498" fill="#94a3b8" font-size="12">(25.5 b/v)</text><text x="880" y="498" fill="#cbd5e1" font-size="13">98.9 KB</text><text x="1020" y="498" fill="#94a3b8" font-size="13">0.66 GB/s</text></g><g class="algo-row"><rect width="1152" height="42" x="24" y="520" fill="rgba(30, 41, 59, 0.35)" rx="8"/><text x="42" y="544" fill="#f1f5f9" font-size="14" font-weight="600">LZ4 (lz4_flex)</text><rect width="340" height="18" x="260" y="530" fill="rgba(15, 23, 42, 0.6)" rx="4"/><rect width="110.296" height="18" x="260" y="530" fill="url(#grad_lz4)" rx="4"/><text x="378.296" y="544" fill="#f472b6" font-size="12" font-weight="500">8.11 GB/s</text><text x="690" y="544" fill="#e2e8f0" font-size="13" font-weight="600">1.97x</text><text x="760" y="544" fill="#94a3b8" font-size="12">(32.6 b/v)</text><text x="880" y="544" fill="#cbd5e1" font-size="13">126.2 KB</text><text x="1020" y="544" fill="#94a3b8" font-size="13">2.85 GB/s</text></g><g class="algo-row"><rect width="1152" height="42" x="24" y="566" fill="rgba(30, 41, 59, 0.35)" rx="8"/><text x="42" y="590" fill="#f1f5f9" font-size="14" font-weight="600">Snappy (snap)</text><rect width="340" height="18" x="260" y="576" fill="rgba(15, 23, 42, 0.6)" rx="4"/><rect width="108.12" height="18" x="260" y="576" fill="url(#grad_snappy)" rx="4"/><text x="376.12" y="590" fill="#818cf8" font-size="12" font-weight="500">7.95 GB/s</text><text x="690" y="590" fill="#e2e8f0" font-size="13" font-weight="600">2.00x</text><text x="760" y="590" fill="#94a3b8" font-size="12">(32.1 b/v)</text><text x="880" y="590" fill="#cbd5e1" font-size="13">124.3 KB</text><text x="1020" y="590" fill="#94a3b8" font-size="13">3.89 GB/s</text></g><g class="algo-row"><rect width="1152" height="42" x="24" y="612" fill="rgba(30, 41, 59, 0.35)" rx="8"/><text x="42" y="636" fill="#f1f5f9" font-size="14" font-weight="600">Chimp128 (graupel)</text><rect width="340" height="18" x="260" y="622" fill="rgba(15, 23, 42, 0.6)" rx="4"/><rect width="7.072" height="18" x="260" y="622" fill="url(#grad_chimp128)" rx="4"/><text x="275.072" y="636" fill="#94a3b8" font-size="12" font-weight="500">0.52 GB/s</text><text x="690" y="636" fill="#e2e8f0" font-size="13" font-weight="600">2.12x</text><text x="760" y="636" fill="#94a3b8" font-size="12">(30.2 b/v)</text><text x="880" y="636" fill="#cbd5e1" font-size="13">116.9 KB</text><text x="1020" y="636" fill="#94a3b8" font-size="13">0.66 GB/s</text></g><g class="algo-row"><rect width="1152" height="42" x="24" y="658" fill="rgba(30, 41, 59, 0.35)" rx="8"/><text x="42" y="682" fill="#f1f5f9" font-size="14" font-weight="600">Gorilla (graupel)</text><rect width="340" height="18" x="260" y="668" fill="rgba(15, 23, 42, 0.6)" rx="4"/><rect width="9.112" height="18" x="260" y="668" fill="url(#grad_gorilla)" rx="4"/><text x="277.112" y="682" fill="#64748b" font-size="12" font-weight="500">0.67 GB/s</text><text x="690" y="682" fill="#e2e8f0" font-size="13" font-weight="600">1.52x</text><text x="760" y="682" fill="#94a3b8" font-size="12">(42.2 b/v)</text><text x="880" y="682" fill="#cbd5e1" font-size="13">163.7 KB</text><text x="1020" y="682" fill="#94a3b8" font-size="13">1.17 GB/s</text></g><text x="36" y="724" fill="#f8fafc" font-size="16" font-weight="bold">典型时序与物理传感器场景细分对比</text><tex