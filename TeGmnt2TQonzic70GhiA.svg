14, 165, 233, 0.2)" stroke="rgba(56, 189, 248, 0.4)" rx="4"/><text x="724.667" y="809" fill="#38bdf8" font-size="9.5" font-weight="bold" text-anchor="middle">Delta-ALP Dominance</text><path stroke="rgba(51, 65, 85, 0.5)" d="M427.333 824h345.334"/><text x="427.333" y="840" fill="#38bdf8" font-size="12" font-weight="bold">fastalp</text><text x="501.333" y="840" fill="#38bdf8" font-size="12" font-weight="bold">431.2x (0.15 b/v)</text><text x="772.667" y="840" fill="#94a3b8" font-size="11" text-anchor="end">28.1 GB/s</text><text x="427.333" y="865" fill="#cbd5e1" font-size="12" font-weight="500">Pcodec</text><text x="501.333" y="865" fill="#fbbf24" font-size="12" font-weight="600">44.5x (1.4 b/v)</text><text x="772.667" y="865" fill="#94a3b8" font-size="11" text-anchor="end">0.85 GB/s</text><text x="427.333" y="890" fill="#cbd5e1" font-size="12" font-weight="500">Zstd</text><text x="501.333" y="890" fill="#a78bfa" font-size="12" font-weight="600">6.93x (9.2 b/v)</text><text x="772.667" y="890" fill="#94a3b8" font-size="11" text-anchor="end">0.90 GB/s</text><text x="427.333" y="915" fill="#cbd5e1" font-size="12" font-weight="500">C++ ALP</text><text x="501.333" y="915" fill="#ef4444" font-size="12" font-weight="600">0.94x (Negative)</text><text x="772.667" y="915" fill="#94a3b8" font-size="11" text-anchor="end">0.58 GB/s</text></g><g class="scenario-card"><rect width="373.333" height="160" x="802.667" y="786" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(51, 65, 85, 0.6)" rx="12"/><text x="816.667" y="810" fill="#f8fafc" font-size="13" font-weight="bold">常数稳定时序 (Constant 1024)</text><rect width="96" height="18" x="1066" y="797" fill="rgba(51, 65, 85, 0.5)" rx="4"/><text x="1114" y="809" fill="#94a3b8" font-size="9.5" font-weight="bold" text-anchor="middle">Fast Zero-Heap Exit</text><path stroke="rgba(51, 65, 85, 0.5)" d="M816.667 824H1162"/><text x="816.667" y="840" fill="#38bdf8" font-size="12" font-weight="bold">fastalp</text><text x="890.667" y="840" fill="#38bdf8" font-s